AWSTemplateFormatVersion: "2010-09-09"
Description: Context Router - container registry with image versioning

Parameters:
  RepositoryName:
    Type: String
    Default: context-router-iac

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 10 newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }


Outputs:
  RepositoryUri:
    Description: Where the CI/CD pipeline pushes images
    Value: !GetAtt Repository.RepositoryUri